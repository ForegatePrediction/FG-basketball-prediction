name: daily-refresh
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      max_days:
        description: "Historical days per league (0 = complete backfill)"
        default: "31"
        type: string
permissions:
  contents: write
concurrency:
  group: daily-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore independent GitHub data checkpoint
        if: ${{ vars.DUAL_CHANNEL_DATA == 'true' }}
        run: bash deploy/github-backup.sh prepare basketball
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Refresh free sources and resume historical backfill
        env:
          MAX_DAYS: ${{ inputs.max_days || '31' }}
        run: python3 refresh.py --max-days "$MAX_DAYS"
      - name: Legacy snapshot commits until VPS migration is verified
        if: ${{ !cancelled() && vars.DUAL_CHANNEL_DATA != 'true' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games/*/ratings.json
          [ ! -f refresh-state.json ] || git add refresh-state.json
          git diff --cached --quiet || git commit -m "chore: refresh basketball snapshots and backfill cursor"
          git push
      - name: Publish verified daily backup to data branch
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: bash deploy/github-backup.sh publish basketball
      - name: Preserve collection diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: basketball-refresh-status
          path: refresh-state.json
          retention-days: 14
