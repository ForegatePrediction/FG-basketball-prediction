name: validate-refresh
on:
  push:
    paths: ['**.py', 'deploy/**', '.github/workflows/*.yml']
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -v
      - run: bash -n deploy/github-backup.sh
